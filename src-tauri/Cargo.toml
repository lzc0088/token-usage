[package]
name = "token-usage"
version = "0.1.0"
description = "Cross-platform menu bar app for tracking AI agent token usage"
authors = ["Ze Chuan"]
edition = "2021"
rust-version = "1.77"

# See docs/plan.md §3 for the full intended module layout (collector/, storage/,
# query/, commands/). This scaffold ships a minimal entry point; later milestones
# add those modules.

[lib]
name = "token_usage_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "macros", "rt", "fs", "io-util", "time"] }
anyhow = "1"
thiserror = "2"
dirs = "6"
ureq = "2"
flate2 = "1"
tar = "0.4"
notify = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
keyring = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
