<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择 T 图标 - Token Usage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .subtitle {
            font-size: 20px;
            color: #6e6e73;
            margin-bottom: 50px;
            font-weight: 400;
        }
        .options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }
        .option {
            background: white;
            border-radius: 24px;
            padding: 40px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 3px solid transparent;
            box-shadow: 0 4px 30px rgba(0,0,0,0.06);
        }
        .option:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 50px rgba(0,0,0,0.12);
        }
        .option.selected {
            border-color: #0066FF;
            box-shadow: 0 12px 50px rgba(0,102,255,0.2);
        }
        .preview-area {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            border-radius: 20px;
            margin-bottom: 25px;
        }
        .preview-area canvas {
            width: 180px;
            height: 180px;
        }
        .option-title {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #1d1d1f;
        }
        .option-desc {
            font-size: 15px;
            line-height: 1.6;
            color: #6e6e73;
            margin-bottom: 15px;
        }
        .option-features {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .feature-tag {
            background: #f5f5f7;
            color: #0066FF;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
        }
        .actions {
            text-align: center;
            padding: 50px 0;
            background: white;
            border-radius: 24px;
            margin-bottom: 40px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.06);
        }
        .btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 18px 48px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 12px;
        }
        .btn:hover {
            background: #0052CC;
            transform: scale(1.02);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .btn-secondary:hover {
            background: #e5e5e7;
        }
        .size-preview {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.06);
        }
        .size-preview h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
        }
        .size-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 30px;
        }
        .size-item {
            text-align: center;
        }
        .size-item canvas {
            margin: 0 auto 15px;
        }
        .size-label {
            font-size: 13px;
            color: #6e6e73;
            font-weight: 600;
        }

        /* Light/dark mode toggle */
        .mode-toggle {
            text-align: center;
            margin: 30px 0;
        }
        .mode-btn {
            background: #f5f5f7;
            border: none;
            padding: 10px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin: 0 8px;
            color: #6e6e73;
        }
        .mode-btn.active {
            background: #1d1d1f;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>选择 T 图标风格</h1>
        <p class="subtitle">外框 + 大写 T，简约专业的经典设计</p>

        <div class="options">
            <div class="option" data-type="basic" onclick="selectOption('basic')">
                <div class="preview-area">
                    <canvas id="preview-basic" width="180" height="180"></canvas>
                </div>
                <div class="option-title">经典版</div>
                <div class="option-desc">圆角方框 + 蓝色 T 字母，简洁专业</div>
                <div class="option-features">
                    <span class="feature-tag">最简约</span>
                    <span class="feature-tag">高对比</span>
                    <span class="feature-tag">16×16清晰</span>
                </div>
            </div>

            <div class="option" data-type="gradient" onclick="selectOption('gradient')">
                <div class="preview-area">
                    <canvas id="preview-gradient" width="180" height="180"></canvas>
                </div>
                <div class="option-title">渐变版</div>
                <div class="option-desc">T 字母使用蓝青渐变，现代科技感</div>
                <div class="option-features">
                    <span class="feature-tag">现代感</span>
                    <span class="feature-tag">视觉丰富</span>
                    <span class="feature-tag">专业配色</span>
                </div>
            </div>

            <div class="option" data-type="modern" onclick="selectOption('modern')">
                <div class="preview-area" style="background: #1a1a2e;">
                    <canvas id="preview-modern" width="180" height="180"></canvas>
                </div>
                <div class="option-title">深色版</div>
                <div class="option-desc">深色背景 + 青色发光 T，科技未来感</div>
                <div class="option-features">
                    <span class="feature-tag">科技感</span>
                    <span class="feature-tag">发光效果</span>
                    <span class="feature-tag">现代酷炫</span>
                </div>
            </div>
        </div>

        <div class="actions">
            <button class="btn" id="downloadBtn" onclick="downloadSelected()" disabled>
                下载选中图标 (512×512)
            </button>
            <button class="btn btn-secondary" id="downloadAllBtn" onclick="downloadAllSizes()" disabled>
                下载所有尺寸
            </button>
        </div>

        <div class="size-preview">
            <h2>不同尺寸预览</h2>
            <div class="size-grid" id="sizeGrid"></div>
        </div>
    </div>

    <script>
        const SVG_SOURCES = {
            basic: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <rect x="0" y="0" width="512" height="512" rx="115" fill="#ffffff"/>
                <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#0066FF" stroke-width="32"/>
                <text x="256" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="280" font-weight="700" fill="#0066FF" text-anchor="middle" dominant-baseline="middle">T</text>
            </svg>`,
            gradient: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="tGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066FF"/>
                        <stop offset="100%" style="stop-color:#00D4FF"/>
                    </linearGradient>
                    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0066FF" flood-opacity="0.2"/>
                    </filter>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="#ffffff"/>
                <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#E5E7EB" stroke-width="32"/>
                <text x="256" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="280" font-weight="700" fill="url(#tGradient)" text-anchor="middle" dominant-baseline="middle" filter="url(#softShadow)">T</text>
            </svg>`,
            modern: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#1a1a2e"/>
                        <stop offset="100%" style="stop-color:#16213e"/>
                    </linearGradient>
                    <linearGradient id="tCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#00D4FF"/>
                        <stop offset="100%" style="stop-color:#0099CC"/>
                    </linearGradient>
                    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
                        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
                    </filter>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGradient)"/>
                <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="url(#tCyan)" stroke-width="8" opacity="0.3"/>
                <text x="256" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="280" font-weight="700" fill="url(#tCyan)" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">T</text>
            </svg>`
        };

        let selectedOption = null;

        function renderIcon(type, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
        }

        function selectOption(type) {
            selectedOption = type;

            // Update UI
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`.option[data-type="${type}"]`).classList.add('selected');

            // Enable buttons
            document.getElementById('downloadBtn').disabled = false;
            document.getElementById('downloadAllBtn').disabled = false;

            // Update size preview
            renderSizeComparison(type);
        }

        function renderSizeComparison(type) {
            const sizes = [16, 32, 64, 128];
            const grid = document.getElementById('sizeGrid');
            grid.innerHTML = '';

            sizes.forEach(size => {
                const item = document.createElement('div');
                item.className = 'size-item';

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;

                const label = document.createElement('div');
                label.className = 'size-label';
                label.textContent = `${size}×${size}`;

                item.appendChild(canvas);
                item.appendChild(label);
                grid.appendChild(item);

                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
            });
        }

        function downloadSelected() {
            if (!selectedOption) return;

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-T-${selectedOption}-512.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[selectedOption]);
        }

        function downloadAllSizes() {
            if (!selectedOption) return;

            const sizes = [16, 32, 64, 128, 256, 512];
            let index = 0;

            function downloadNext() {
                if (index >= sizes.length) return;

                const size = sizes[index++];
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const img = new Image();

                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                    canvas.toBlob(function(blob) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${size}x${size}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setTimeout(downloadNext, 400);
                    }, 'image/png');
                };

                img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[selectedOption]);
            }

            downloadNext();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            renderIcon('basic', 'preview-basic');
            renderIcon('gradient', 'preview-gradient');
            renderIcon('modern', 'preview-modern');
        });
    </script>
</body>
</html>
