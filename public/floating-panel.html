<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Theme palettes — mirror the app's app.css variables. */
    :root {
      --glass: rgba(28, 26, 22, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --amber: #e8b04b;
      --shadow: rgba(0, 0, 0, 0.35);
    }
    body.theme-light {
      --glass: rgba(255, 255, 255, 0.85);
      --border: rgba(0, 0, 0, 0.08);
      --amber: #c98a1e;
      --shadow: rgba(0, 0, 0, 0.16);
    }

    /* The pill fills the window. Its OUTER end (away from the handle) is
       rounded; the inner end is flat and slides under the handle, so the two
       form one seamless capsule (no daylight between them). */
    .pill {
      width: 100%;
      height: 100%;
      background: var(--glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      box-shadow: 0 6px 18px var(--shadow);
      display: flex;
      align-items: center;
      color: var(--amber);
      font-family: "SF Mono", "JetBrains Mono", "Cascadia Code", "Consolas", monospace;
      font-weight: 600;
      font-size: 15px;
      letter-spacing: -0.01em;
      cursor: pointer;
      /* default (panel left of handle): round the left/outer end, flat right. */
      border-radius: 22px 0 0 22px;
      padding: 0 12px;
    }
    /* Panel on the right of the handle → round the right/outer end. */
    body.side-right .pill {
      border-radius: 0 22px 22px 0;
      flex-direction: row-reverse;
    }

    /* The value stays clear of the overlap region (the ~22px tucked under the
       handle) so it never sits under the handle's circle. */
    body.side-left .pill  { padding-right: 30px; justify-content: flex-start; }
    body.side-right .pill { padding-left: 30px; }

    .pill .placeholder { color: var(--amber); opacity: 0.4; }
  </style>
</head>
<body class="theme-dark side-left">
  <div class="pill" id="pill"><span id="val" class="placeholder">–</span></div>

  <script>
    (function () {
      function boot() {
        const T = window.__TAURI__;
        if (!T || !T.core || !T.event) { setTimeout(boot, 80); return; }
        setup(T.core.invoke, T.event.listen);
      }

      function setup(invoke, listen) {
        const val = document.getElementById("val");

        function apply(payload) {
          if (!payload) return;
          document.body.classList.toggle("theme-light", payload.theme === "light");
          document.body.classList.toggle("theme-dark", payload.theme !== "light");
          document.body.classList.toggle("side-right", payload.side === "right");
          document.body.classList.toggle("side-left", payload.side !== "right");
          if (payload.text != null) {
            const t = payload.text && payload.text.length ? payload.text : "–";
            val.textContent = t;
            val.classList.toggle("placeholder", !payload.text || payload.text.length === 0);
          }
        }

        // Hover bridging: entering the panel cancels the hide the handle
        // started; leaving restarts it. Both delegate timing to Rust.
        document.body.addEventListener("mouseenter", () => {
          invoke("show_floating_panel").catch(() => {});
        });
        document.body.addEventListener("mouseleave", () => {
          invoke("hide_floating_panel").catch(() => {});
        });

        // Click anywhere on the panel → open the main popover (same as handle).
        document.body.addEventListener("click", () => {
          invoke("show_main_window").catch(() => {});
        });

        listen("floating:update", (e) => apply(e.payload));
        invoke("get_floating_data").then(apply).catch(() => {});
      }

      boot();
    })();
  </script>
</body>
</html>
