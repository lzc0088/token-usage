<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Floating</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* OPAQUE background: the OS window is transparent:false, so an alpha/transparent
         body would let Windows apply its translucent (glass) backdrop. A solid fill
         makes the window fully opaque — no glass. The window's corners are rounded by
         the OS (DWM on Windows 11). */
      background: var(--glass);
      user-select: none;
      -webkit-user-select: none;
    }

    /* Right edge by default: capsule pinned to the window's right edge
       (= the screen edge). `edge-left` mirrors it to the left edge. */
    body {
      display: flex;
      justify-content: flex-end;
    }
    body.edge-left {
      justify-content: flex-start;
    }

    /* Theme palettes — solid (opaque) backgrounds. The widget sits on a
       transparent OS window, so an alpha background would show the desktop
       through it. Solid keeps the "T" crisp and the shape clean. No box-shadow:
       a blurred shadow on a transparent window renders as a soft halo that
       reads as a "glass/blur" box around the capsule. */
    :root {
      --glass: rgb(30, 28, 24);
      --amber: #e8b04b;
    }
    body.theme-light {
      --glass: rgb(255, 255, 255);
      --amber: #c98a1e;
    }

    /*
     * Floating widget — the capsule FILLS an OPAQUE OS window; the WINDOW
     * resizes on hover (Rust). No border, no shadow, no blur (solid fill only).
     * Corners are SQUARE (Windows 11 DWM rounding disabled in Rust), flush
     * against the configured screen edge.
     *   - Collapsed (44 wide): a square tab showing only the "T".
     *   - Expanded (148 wide): a square pill — "T" + the data value fades in.
     * The "T" is absolutely positioned so it is ALWAYS visible.
     */
    .capsule {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--glass);
      overflow: hidden;
      cursor: pointer;
    }

    /* "T" icon: absolutely positioned at the ROUNDED outer cap (left for the
       right-edge default). Using absolute positioning (not flex) guarantees the
       "T" is always rendered inside the 44px collapsed capsule — a flex child
       beside the data span can get pushed/clipped when the data doesn't shrink
       to zero, making the "T" disappear. */
    .t-icon {
      position: absolute;
      left: 0;
      top: 0;
      width: 44px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
      font-weight: 700;
      font-size: 18px;
      color: var(--amber);
    }

    /* Data value: sits beside the "T" (toward the screen edge), revealed as
       the capsule widens. Hidden (opacity 0) until hover. */
    .data {
      position: absolute;
      left: 44px;
      top: 0;
      height: 100%;
      width: 104px;
      display: flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      font-family: "SF Mono", "JetBrains Mono", "Consolas", monospace;
      font-weight: 600;
      font-size: 15px;
      color: var(--amber);
      letter-spacing: -0.01em;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .capsule:hover .data {
      opacity: 1;
    }
    .capsule:hover .data.placeholder {
      opacity: 0.35;
    }

    /* Left edge: mirror — "T" at the right, data to its left. */
    body.edge-left .t-icon {
      left: auto;
      right: 0;
    }
    body.edge-left .data {
      left: auto;
      right: 44px;
    }
  </style>
</head>
<body class="theme-dark">

  <div class="capsule" id="capsule">
    <span class="data" id="val">–</span>
    <span class="t-icon">T</span>
  </div>

  <script>
    (function () {
      function boot() {
        const T = window.__TAURI__;
        if (!T || !T.core || !T.event || !T.window) { setTimeout(boot, 80); return; }
        setup(T.core.invoke, T.event.listen, T.window.getCurrentWindow());
      }

      function setup(invoke, listen, win) {
        const capsule = document.getElementById("capsule");
        const val = document.getElementById("val");

        function apply(payload) {
          if (!payload) return;
          document.body.classList.toggle("theme-light", payload.theme === "light");
          document.body.classList.toggle("theme-dark", payload.theme !== "light");
          // Edge variant: "left" mirrors the capsule; anything else = right.
          document.body.classList.toggle("edge-left", payload.position === "left");
          if (payload.text != null) {
            const t = payload.text && payload.text.length ? payload.text : "–";
            val.textContent = t;
            val.classList.toggle("placeholder", !payload.text || payload.text.length === 0);
          }
        }

        // Hover grows the window (Rust resizes it, keeping the screen-edge side
        // fixed) so the data shows; leaving shrinks it back. Resizing the OS
        // window — rather than a CSS width animation on a 148-wide transparent
        // window — avoids the large transparent region that Windows WebView2
        // renders as a glass/blur box.
        capsule.addEventListener("mouseenter", () => {
          invoke("show_floating_panel").catch(() => {});
          invoke("expand_floating").catch(() => {});
        });
        capsule.addEventListener("mouseleave", () => {
          invoke("collapse_floating").catch(() => {});
        });

        // Pointer-based click vs. drag. We do NOT also bind a `click` listener:
        // the browser fires `click` after a clean `pointerup`, so binding both
        // would toggle twice (open → immediately close = "does nothing").
        // pointerup alone handles the click (no drag) case.
        let down = null;
        capsule.addEventListener("pointerdown", (e) => {
          down = { x: e.screenX, y: e.screenY, moved: false };
        });
        capsule.addEventListener("pointermove", (e) => {
          if (!down || down.moved) return;
          const dx = Math.abs(e.screenX - down.x);
          const dy = Math.abs(e.screenY - down.y);
          // Only allow vertical drag (along the screen edge). Horizontal
          // movement stays locked — the widget is flush against the edge.
          if (dy > dx && dy > 4) {
            down.moved = true;
            win.startDragging().catch(() => {});
          }
        });
        capsule.addEventListener("pointerup", () => {
          if (down && !down.moved) {
            // Toggle the main popover: open if closed, close if open. This
            // widget stays visible so the user can click again to dismiss.
            invoke("toggle_main_window").catch(() => {});
          }
          down = null;
        });

        listen("floating:update", (e) => apply(e.payload));
        invoke("get_floating_data").then(apply).catch(() => {});
      }

      boot();
    })();
  </script>
</body>
</html>
