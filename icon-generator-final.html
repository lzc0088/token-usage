<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标生成器 - Token Usage</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
            padding: 60px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            font-size: 42px;
            font-weight: 700;
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 18px;
            color: #6e6e73;
            margin-bottom: 50px;
        }
        .sections {
            display: grid;
            grid-template-columns: 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }
        .section {
            background: white;
            border-radius: 28px;
            padding: 40px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.08);
        }
        .section h2 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .section p {
            font-size: 15px;
            color: #6e6e73;
            line-height: 1.6;
            margin-bottom: 25px;
        }
        .spec {
            background: #f5f5f7;
            padding: 15px 20px;
            border-radius: 12px;
            margin: 16px 0;
            font-size: 14px;
            color: #0066FF;
            font-weight: 600;
        }
        .preview {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            margin-bottom: 25px;
        }
        .preview canvas {
            width: 200px;
            height: 200px;
        }
        .preview.menubar { background: #1d1d1f; }
        .preview.app { background: linear-gradient(135deg, #f5f5f7, #e5e7eb); }
        .actions {
            text-align: center;
            padding: 50px 0;
        }
        .btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 17px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            margin: 0 12px;
        }
        .btn:hover {
            background: #0052CC;
            transform: scale(1.02);
        }
        .btn-secondary {
            background: #f5f5f7;
            color: #1d1d1f;
        }
        .btn-secondary:hover {
            background: #e5e5e7;
        }
        .info {
            background: #e8f5ff;
            border-left: 4px solid #0066FF;
            padding: 20px;
            border-radius: 12px;
            margin: 40px 0;
            font-size: 14px;
            color: #0066FF;
        }
        .info h3 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .info ul {
            margin: 10px 0;
            padding-left: 20px;
        }
        .info li {
            margin: 8px 0;
            color: #6e6e73;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 Token Usage 图标生成器</h1>
        <p class="subtitle">两个图标：菜单栏全白 + App 蓝底白T（加粗）</p>

        <div class="info">
            <h3>图标规格说明</h3>
            <ul>
                <li><strong>菜单栏图标</strong>：全白色设计，适配 macOS 浅色/深色菜单栏</li>
                <li><strong>App 图标</strong>：蓝色渐变背景 (#0066FF → #0052CC) + 白色加粗 T 文字</li>
            </ul>
        </div>

        <div class="sections">
            <div class="section">
                <h2>📍 菜单栏图标 (全白)</h2>
                <p>全白色设计，符合 macOS 标准。在浅色和深色菜单栏都清晰可见。</p>
                <div class="spec">用途：macOS 菜单栏 (16×16)</div>
                <div class="preview menubar">
                    <canvas id="menubar-preview" width="200" height="200"></canvas>
                </div>
                <button class="btn" onclick="downloadMenubar()">
                    下载菜单栏图标
                </button>
            </div>

            <div class="section">
                <h2>📱 App 图标 (蓝底白T)</h2>
                <p>蓝色渐变背景 + 白色加粗 T 文字。专业、现代、有辨识度。</p>
                <div class="spec">用途：App 主图标 (512×512)</div>
                <div class="preview app">
                    <canvas id="app-preview" width="200" height="200"></canvas>
                </div>
                <button class="btn" onclick="downloadApp()">
                    下载 App 图标
                </button>
            </div>
        </div>

        <div class="actions">
            <button class="btn btn-secondary" onclick="downloadAll()">
                下载所有两个图标
            </button>
        </div>
    </div>

    <script>
        const SVG_SOURCES = {
            menubar: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <rect x="0" y="0" width="512" height="512" fill="none"/>
                <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#ffffff" stroke-width="32"/>
                <text x="256" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="280" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">T</text>
            </svg>`,
            app: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="appBlueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066FF"/>
                        <stop offset="100%" style="stop-color:#0052CC"/>
                    </linearGradient>
                    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
                    </filter>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#appBlueGradient)"/>
                <rect x="56" y="56" width="400" height="400" rx="80" fill="none" stroke="#ffffff" stroke-width="24" opacity="0.3"/>
                <text x="256" y="285" font-family="SF Pro Display, -apple-system, sans-serif" font-size="280" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle" filter="url(#appShadow)">T</text>
            </svg>`
        };

        function renderPreview(type, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
        }

        function downloadMenubar() {
            downloadIcon('menubar', 16, '16x16.png');
        }

        function downloadApp() {
            downloadIcon('app', 512, 'icon.png');
        }

        function downloadAll() {
            downloadMenubar();
            setTimeout(downloadApp, 500);
        }

        function downloadIcon(type, size, filename) {
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.drawImage(img, 0, 0, size, size);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            renderPreview('menubar', 'menubar-preview');
            renderPreview('app', 'app-preview');
        });
    </script>
</body>
</html>
