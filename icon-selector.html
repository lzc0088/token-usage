<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>选择图标 - Token Usage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f7;
            color: #1d1d1f;
        }
        h1 { color: #0066FF; margin-bottom: 10px; }
        .subtitle { color: #6e6e73; margin-bottom: 40px; font-size: 18px; }
        .options { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 40px; }
        .option {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
        }
        .option:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .option.selected {
            border-color: #0066FF;
            box-shadow: 0 8px 30px rgba(0,102,255,0.2);
        }
        .option-preview {
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f7;
            border-radius: 16px;
        }
        .option-preview img { width: 150px; height: 150px; }
        .option-title { font-size: 22px; font-weight: 600; margin-bottom: 12px; text-align: center; }
        .option-desc { font-size: 14px; color: #6e6e73; text-align: center; line-height: 1.6; }
        .option-pros { font-size: 13px; color: #0066FF; margin-top: 15px; text-align: center; font-weight: 500; }
        .actions { text-align: center; padding: 40px 0; }
        .btn {
            background: #0066FF;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            margin: 0 10px;
        }
        .btn:hover { background: #0052CC; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .comparison { background: white; padding: 30px; border-radius: 20px; margin: 40px 0; }
        .comparison h2 { margin-top: 0; }
        .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 20px 0; }
        .size-item { text-align: center; }
        .size-item canvas { margin: 0 auto 10px; }
        .size-item span { font-size: 12px; color: #6e6e73; }
    </style>
</head>
<body>
    <h1>🎨 选择图标风格</h1>
    <p class="subtitle">三个专业选项，每个都是简约且直观的经典符号</p>

    <div class="options">
        <div class="option" data-type="battery" onclick="selectOption('battery')">
            <div class="option-preview">
                <canvas id="preview-battery" width="150" height="150"></canvas>
            </div>
            <div class="option-title">🔋 电池图标</div>
            <div class="option-desc">全世界通用的消耗追踪符号。电量条代表当前用量。</div>
            <div class="option-pros">✓ 最直观 ✓ 通用符号 ✓ 专业感强</div>
        </div>

        <div class="option" data-type="pie" onclick="selectOption('pie')">
            <div class="option-preview">
                <canvas id="preview-pie" width="150" height="150"></canvas>
            </div>
            <div class="option-title">📊 圆环图</div>
            <div class="option-desc">经典数据可视化符号。多个数据段展示用量分布。</div>
            <div class="option-pros">✓ 数据感强 ✓ 经典设计 ✓ 视觉平衡</div>
        </div>

        <div class="option" data-type="bars" onclick="selectOption('bars')">
            <div class="option-preview">
                <canvas id="preview-bars" width="150" height="150"></canvas>
            </div>
            <div class="option-title">📈 柱状图</div>
            <div class="option-desc">最简洁的统计符号。三柱数据展示，经典不衰。</div>
            <div class="option-pros">✓ 最简约 ✓ 清晰可辨 ✓ 永不过时</div>
        </div>
    </div>

    <div class="actions">
        <button class="btn" id="downloadBtn" onclick="downloadSelected()" disabled>
            下载选中的图标 (512×512)
        </button>
        <button class="btn" id="downloadAllBtn" onclick="downloadAllSizes()">
            下载所有尺寸 (16×16 ~ 512×512)
        </button>
    </div>

    <div class="comparison">
        <h2>🔍 不同尺寸预览</h2>
        <p style="color: #6e6e73;">选择一个图标查看它在不同尺寸下的显示效果</p>
        <div class="size-grid" id="sizeGrid"></div>
    </div>

    <script>
        const SVG_SOURCES = {
            battery: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="batteryBlue" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066FF"/>
                        <stop offset="100%" style="stop-color:#0052CC"/>
                    </linearGradient>
                    <linearGradient id="chargeOrange" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B35"/>
                        <stop offset="100%" style="stop-color:#FF8551"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="#ffffff"/>
                <rect x="106" y="106" width="300" height="300" rx="40" fill="none" stroke="url(#batteryBlue)" stroke-width="24"/>
                <rect x="390" y="196" width="40" height="120" rx="12" fill="url(#batteryBlue)"/>
                <rect x="130" y="130" width="200" height="252" rx="24" fill="url(#chargeOrange)"/>
            </svg>`,
            pie: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="pieBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0066FF"/>
                        <stop offset="100%" style="stop-color:#0052CC"/>
                    </linearGradient>
                    <linearGradient id="pieOrange" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#FF6B35"/>
                        <stop offset="100%" style="stop-color:#FF8551"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="#ffffff"/>
                <circle cx="256" cy="256" r="160" fill="none" stroke="#E5E7EB" stroke-width="48"/>
                <path d="M 256 96 A 160 160 0 0 1 394.28 341.28" fill="none" stroke="url(#pieBlue)" stroke-width="48" stroke-linecap="round"/>
                <path d="M 394.28 341.28 A 160 160 0 0 1 117.72 341.28" fill="none" stroke="url(#pieOrange)" stroke-width="48" stroke-linecap="round"/>
                <path d="M 117.72 341.28 A 160 160 0 0 1 256 96" fill="none" stroke="#0052CC" stroke-width="48" stroke-linecap="round" opacity="0.4"/>
                <circle cx="256" cy="256" r="80" fill="#ffffff"/>
                <g fill="#0052CC">
                    <circle cx="256" cy="236" r="12"/>
                    <circle cx="236" cy="276" r="12" opacity="0.6"/>
                    <circle cx="276" cy="276" r="12" opacity="0.6"/>
                </g>
            </svg>`,
            bars: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                <defs>
                    <linearGradient id="barBlue" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#0052CC"/>
                        <stop offset="100%" style="stop-color:#0066FF"/>
                    </linearGradient>
                    <linearGradient id="barOrange" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" style="stop-color:#FF6B35"/>
                        <stop offset="100%" style="stop-color:#FF8551"/>
                    </linearGradient>
                </defs>
                <rect x="0" y="0" width="512" height="512" rx="115" fill="#ffffff"/>
                <rect x="80" y="256" width="96" height="200" rx="24" fill="#0052CC" opacity="0.5"/>
                <rect x="208" y="106" width="96" height="350" rx="24" fill="url(#barBlue)"/>
                <rect x="336" y="186" width="96" height="270" rx="24" fill="url(#barOrange)"/>
            </svg>`
        };

        let selectedOption = null;

        function renderIcon(type, canvasId) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
        }

        function selectOption(type) {
            selectedOption = type;

            // Update UI
            document.querySelectorAll('.option').forEach(opt => {
                opt.classList.remove('selected');
            });
            document.querySelector(`.option[data-type="${type}"]`).classList.add('selected');

            // Enable download button
            document.getElementById('downloadBtn').disabled = false;

            // Update size comparison
            renderSizeComparison(type);
        }

        function renderSizeComparison(type) {
            const sizes = [16, 32, 64, 128];
            const grid = document.getElementById('sizeGrid');
            grid.innerHTML = '';

            sizes.forEach(size => {
                const item = document.createElement('div');
                item.className = 'size-item';

                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                canvas.id = `size-${size}`;

                const label = document.createElement('span');
                label.textContent = `${size}×${size}`;

                item.appendChild(canvas);
                item.appendChild(label);
                grid.appendChild(item);

                // Render
                const ctx = canvas.getContext('2d');
                const img = new Image();
                img.onload = function() {
                    ctx.clearRect(0, 0, size, size);
                    ctx.drawImage(img, 0, 0, size, size);
                };
                img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[type]);
            });
        }

        function downloadSelected() {
            if (!selectedOption) return;

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = function() {
                ctx.drawImage(img, 0, 0);
                canvas.toBlob(function(blob) {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${selectedOption}-512.png`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[selectedOption]);
        }

        function downloadAllSizes() {
            if (!selectedOption) {
                alert('请先选择一个图标');
                return;
            }

            const sizes = [16, 32, 64, 128, 256, 512];
            let index = 0;

            function downloadNext() {
                if (index >= sizes.length) return;

                const size = sizes[index++];
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                const img = new Image();

                img.onload = function() {
                    ctx.drawImage(img, 0, 0, size, size);
                    canvas.toBlob(function(blob) {
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `${size}x${size}.png`;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        URL.revokeObjectURL(url);
                        setTimeout(downloadNext, 300);
                    }, 'image/png');
                };

                img.src = 'data:image/svg+xml;base64,' + btoa(SVG_SOURCES[selectedOption]);
            }

            downloadNext();
        }

        // Initialize
        window.addEventListener('DOMContentLoaded', () => {
            renderIcon('battery', 'preview-battery');
            renderIcon('pie', 'preview-pie');
            renderIcon('bars', 'preview-bars');
        });
    </script>
</body>
</html>
