name: CI

# T0.3 — three-platform build skeleton. Runs on every PR and push to main.
# See docs/plan.md §12. Tag-triggered release bundling lives in release.yml.

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Linux Tauri needs webkit2gtk and friends.
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm install

      - name: Fetch tokscale binary
        # tauri_build::build() (run by every cargo command below) strictly
        # validates bundle.resources — the tokscale sidecar must be present.
        # Fetch it once here so clippy/test/check don't each re-fetch.
        # (build.rs also self-heals as a fallback, but this is the fast path.)
        env:
          TAURI_TARGET: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          TOKSCALE_REGISTRY: https://registry.npmjs.org
        run: node scripts/fetch-tokscale.mjs

      - name: Lint / type-check frontend
        run: npm run check

      - name: Cargo fmt + clippy
        working-directory: src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all

      - name: Build frontend
        run: npm run build

      - name: Cargo check (Tauri build context)
        working-directory: src-tauri
        run: cargo check --release ${{ matrix.args }}
