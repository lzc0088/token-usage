name: Sync from Gitee

# 把 Gitee 主仓库的变更（分支 + tag）定时镜像到本 GitHub 仓库，让日常
# push 只需发到 Gitee；tag 到达 GitHub 后会自动触发 release.yml 构建三平台
# 安装包并回传到 Gitee Release。
#
# 为什么用 PAT 而非默认 GITHUB_TOKEN：用 GITHUB_TOKEN push 的 tag **不会**
# 触发其他 workflow（GitHub 的防循环机制），release.yml 永远不会跑。必须用
# 一个有 repo 权限的 Personal Access Token，其 push 的 tag 才会正常触发。
#
# 一次性设置（见 plan）：
#   1. GitHub → Settings → Developer settings → Personal access tokens → 生成
#      一个 Classic Token（勾 `repo`）或 Fine-grained Token（勾本仓库
#      Contents: Read and write）。
#   2. GitHub 仓库 → Settings → Secrets → Actions → 加 secret `GH_PAT`。
#
# 延迟：GitHub cron 最短 5 分钟，且高峰期可能延迟到 ~15 分钟。急时可手动
# 「Actions → Sync from Gitee → Run workflow」立即同步。

on:
  schedule:
    - cron: '*/10 * * * *' # 每 10 分钟（GitHub cron 实际可能更久）
  workflow_dispatch: {} # 手动立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror Gitee → GitHub
        env:
          # secret / 仓库标识走 env，不直接插值进 run 命令（防注入 + 不进 ps 列表）
          GH_PAT: ${{ secrets.GH_PAT }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror https://gitee.com/lzc0088/token-usage.git repo
          cd repo
          # --prune: 删除 GitHub 上有但 Gitee 上已不存在的 ref（纯镜像）
          # 只推 heads + tags，避免误碰其他 ref
          git push --prune --force \
            "https://x-access-token:${GH_PAT}@github.com/${TARGET_REPO}.git" \
            'refs/heads/*' 'refs/tags/*'

      - name: Summary
        run: |
          echo "Mirrored Gitee → ${{ github.repository }}"
          echo "New tags will trigger the Release workflow automatically."
