name: Release

# Tag-triggered three-platform bundle → Gitee Release. See docs/plan.md §12.
# (re-index: force GitHub Actions to register this workflow)
# V1 produces unsigned mac .dmg / Win .msi+.exe / Linux AppImage+.deb
# (mac is NOT signed/notarized by design — see design.md §8).
#
# Flow: the `bundle` job builds per-platform WITHOUT creating a GitHub Release
# (installers are uploaded as workflow artifacts), then `publish-gitee` downloads
# them all and uploads to the matching Gitee Release. The app's in-app update
# checker reads https://gitee.com/api/v5/repos/lzc0088/token-usage/releases/latest.
#
# One-time setup (see plan): create a GitHub mirror repo, add it as a `github`
# remote, and set repo secrets GITEE_ACCESS_TOKEN + JUHE_API_KEY.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm install

      - name: Fetch tokscale binary (bundled)
        # Download the platform-native tokscale binary so Tauri bundles it as
        # a resource (zero network dependency for end users on first launch).
        env:
          # macOS cross-compile: the runner is x86_64 but we target arm64.
          # Tell the script which arch to fetch instead of detecting the host.
          TAURI_TARGET: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
        run: node scripts/fetch-tokscale.mjs

      # Build only — no GitHub Release is created (tagName omitted). Installers
      # are uploaded as workflow artifacts; `publish-gitee` ships them to Gitee.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # build.rs injects these into the binary so the shipped app can do
          # update checks (higher Gitee rate limit) and fetch exchange rates.
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          # Vite injects this at frontend build time — settings page default repo.
          VITE_UPDATE_REPO: gitee.com/lzc0088/token-usage
        with:
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true

  publish-gitee:
    needs: bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish installers to Gitee Release
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: bash scripts/publish-gitee.sh
