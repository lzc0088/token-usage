name: Release

# Tag-triggered three-platform bundle → GitHub Release.
# V1 produces unsigned mac .dmg / Win .msi+.exe / Linux AppImage+.deb
# (mac is NOT signed/notarized by design — see design.md §8).
#
# Each platform build uploads its installer directly to a GitHub Release
# created for the tag. The app's in-app update checker reads
# https://api.github.com/repos/lzc0088/token-usage/releases/latest.
#
# One-time setup: set repository secret JUHE_API_KEY (exchange rate API).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # macOS only: import the Developer ID certificate for signing + notarizing.
      - name: Import Apple certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Decode the base64 .p12 into a temp keychain, so tauri/codesign can
          # find the "Developer ID Application" identity during build.
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "build-keychain" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "build-keychain" build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "build-keychain" build.keychain
          rm -f certificate.p12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm install

      - name: Fetch tokscale binary (bundled)
        # Download the platform-native tokscale binary so Tauri bundles it as
        # a resource (zero network dependency for end users on first launch).
        env:
          # macOS cross-compile: the runner is x86_64 but we target arm64.
          # Tell the script which arch to fetch instead of detecting the host.
          TAURI_TARGET: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
        run: node scripts/fetch-tokscale.mjs

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          if [ -f scripts/RELEASE_NOTES.md ]; then
            {
              echo 'body<<RELEASE_EOF'
              cat scripts/RELEASE_NOTES.md
              echo 'RELEASE_EOF'
            } >> "${GITHUB_OUTPUT}"
          else
            echo "body=## Token Usage \${{ github.ref_name }}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # build.rs injects this into the binary so the shipped app can
          # fetch live exchange rates (USD→CNY).
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          # Vite injects this at frontend build time — settings page default repo.
          VITE_UPDATE_REPO: github.com/lzc0088/token-usage
          # macOS signing + notarization (only read on the macos-latest job).
          # Tauri reads these to sign the .app and submit it to Apple for
          # notarization + stapling. See tauri.conf.json → bundle.macOS.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Token Usage ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
