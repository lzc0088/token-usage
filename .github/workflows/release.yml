name: Release

# Tag-triggered three-platform bundle → GitHub Release.
# V1 produces unsigned mac .dmg / Win .msi+.exe / Linux AppImage+.deb
# (mac is NOT signed/notarized by design — see design.md §8).
#
# Each platform build uploads its installer directly to a GitHub Release
# created for the tag. The app's in-app update checker reads
# https://api.github.com/repos/lzc0088/token-usage/releases/latest.
#
# One-time setup: set repository secret JUHE_API_KEY (exchange rate API).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # macOS only: import the Developer ID certificate into a dedicated
      # keychain that's added to the search list (NOT replacing the default).
      # This is the known fix for tauri-action #941 where codesign hangs in CI
      # because the keychain partition list blocks private-key access.
      - name: Import Apple certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PW="build-keychain-pw"

          # Create a dedicated keychain and add it to the search list
          # (without removing the default login keychain).
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Unlock it (codesign needs unlocked access) and allow it to stay
          # unlocked so codesign never blocks on an interactive prompt.
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          # Import the .p12 with codesign + security trusted.
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security

          # Grant codesign access to the private key without prompting.
          # (The -s flag + apple-tool:/codesign: partition is what unblocks #941.)
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"

          rm -f certificate.p12

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install npm deps
        run: npm install

      - name: Fetch tokscale binary (bundled)
        # Download the platform-native tokscale binary so Tauri bundles it as
        # a resource (zero network dependency for end users on first launch).
        env:
          # macOS cross-compile: the runner is x86_64 but we target arm64.
          # Tell the script which arch to fetch instead of detecting the host.
          TAURI_TARGET: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}
          # CI runners are US-based → use the official npm registry. The script's
          # default (npmmirror) is a China mirror that's slow/unreliable from US
          # runners and caused the Windows build to ship without tokscale.exe,
          # tripping tauri_build's resource validation.
          TOKSCALE_REGISTRY: https://registry.npmjs.org
        run: node scripts/fetch-tokscale.mjs

      - name: Verify tokscale binary present
        # Fail fast with a clear message if fetch didn't land the binary —
        # otherwise tauri-action fails later with a confusing
        # "resource path 'bin/tokscale.exe' doesn't exist".
        shell: bash
        run: |
          echo "Contents of src-tauri/bin/:"
          ls -la src-tauri/bin/ || true
          if [ ! -f src-tauri/bin/tokscale ] && [ ! -f src-tauri/bin/tokscale.exe ]; then
            echo "::error::tokscale binary missing after fetch — check the Fetch step logs (registry / network)"
            exit 1
          fi
          echo "OK: tokscale binary present"

      - name: Read release notes
        id: notes
        shell: bash
        run: |
          if [ -f scripts/RELEASE_NOTES.md ]; then
            {
              echo 'body<<RELEASE_EOF'
              cat scripts/RELEASE_NOTES.md
              echo 'RELEASE_EOF'
            } >> "${GITHUB_OUTPUT}"
          else
            echo "body=## Token Usage \${{ github.ref_name }}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # build.rs injects this into the binary so the shipped app can
          # fetch live exchange rates (USD→CNY).
          JUHE_API_KEY: ${{ secrets.JUHE_API_KEY }}
          # Vite injects this at frontend build time — settings page default repo.
          VITE_UPDATE_REPO: github.com/lzc0088/token-usage
          # macOS signing + notarization. Tauri's bundle step signs the main
          # .app; the tokscale sidecar is pre-signed via beforeBundleCommand
          # (see tauri.conf.json) so it survives the bundle packaging.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Read by scripts/sign-sidecar.sh (runs as beforeBundleCommand).
          APPLE_SIGN_IDENTITY: "Developer ID Application: Ze Chuan Liu (2F74TS79TL)"
          # Updater signing key — signs the update packages (.tar.gz/.exe/.AppImage)
          # so the in-app updater can verify them against the pubkey in
          # tauri.conf.json. tauri-action auto-generates latest.json + .sig
          # files when these are present + createUpdaterArtifacts is true.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Token Usage ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          # Prefer NSIS -setup.exe in latest.json (updater-friendly, silent install)
          # over the .msi variant.
          updaterJsonPreferNsis: true

  # ── Windows code signing (SignPath Foundation — free for open source) ──────
  # Runs after all three platform builds finish. Downloads the unsigned Windows
  # NSIS installer from the just-created GitHub Release, submits it to SignPath
  # for code signing, then replaces the unsigned asset with the signed one.
  # Prerequisite: register at signpath.io (see docs/release.md § SignPath 注册).
  sign-windows:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows NSIS installer from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p unsigned signed
          gh release download "${{ github.ref_name }}" \
            --pattern "*-setup.exe" \
            --dir unsigned/ \
            --clobber
          ls -lh unsigned/

      - name: Upload unsigned NSIS installer as artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-unsigned
          path: unsigned/

      - name: Submit to SignPath for code signing
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/

      - name: Replace unsigned asset with signed installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ github.ref_name }}"

          # Delete the unsigned -setup.exe asset from the release.
          ASSET_ID=$(gh release view "$RELEASE_TAG" \
            --json assets \
            -q '.assets[] | select(.name | test("-setup\\.exe$")) | .id')
          if [ -n "$ASSET_ID" ]; then
            echo "Deleting unsigned asset id=$ASSET_ID"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$ASSET_ID"
          fi

          # Upload the signed .exe (SignPath returns it inside the ZIP — the
          # action extracts to signed/). Find the first .exe and upload it.
          SIGNED=$(find signed/ -name '*.exe' -o -name '*-setup*' | head -1)
          if [ -z "$SIGNED" ]; then
            echo "::error::No signed .exe found in signed/ — listing contents:"
            find signed/ -type f
            exit 1
          fi

          echo "Uploading signed installer: $SIGNED"
          gh release upload "$RELEASE_TAG" "$SIGNED" --clobber
